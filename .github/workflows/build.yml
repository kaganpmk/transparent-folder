name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build TransparentFolder.sln -c Release

      - name: Package release archives
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version ci

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transparent-folder-ci
          path: release/*.zip
          if-no-files-found: error
