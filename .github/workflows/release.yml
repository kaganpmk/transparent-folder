name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build TransparentFolder.sln -c Release

      - name: Package release archives
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "${{ github.ref_name }}"

      - name: Upload release artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: transparent-folder-release
          path: release/*.zip
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-release

      - name: Upload signed release artifacts
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: transparent-folder-signed-release
          path: signed-release/*
          if-no-files-found: error
